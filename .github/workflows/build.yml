name: Build PS4 PKG

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  OO_VERSION: v0.5.4
  SRC: pkg_vault.c
  NAME: pkg_vault
  TITLE: PKG Vault
  TITLE_ID: BREW00001
  CONTENT_ID: IV0000-BREW00001_00-PKGVAULT00000000
  VERSION: "01.01"
  EXTRA_CFLAGS: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and lld
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 curl ca-certificates

      - name: Download OpenOrbis toolchain
        run: |
          set -euo pipefail
          TC="$RUNNER_TEMP/OpenOrbis-PS4-Toolchain"
          mkdir -p "$TC"
          curl -fL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/tc.tar.gz" \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/${OO_VERSION}/toolchain-llvm-18.tar.gz"
          tar -xzf "$RUNNER_TEMP/tc.tar.gz" --strip-components=2 -C "$TC"
          chmod +x "$TC"/bin/linux/*
          if [ ! -f "$TC/link.x" ]; then
            echo "link.x missing. File listing:"
            tar -tzf "$RUNNER_TEMP/tc.tar.gz" | head -20
            exit 1
          fi
          echo "OO_PS4_TOOLCHAIN=$TC" >> "$GITHUB_ENV"

      - name: Compile, link and make eboot.bin
        run: |
          set -euo pipefail
          TC="$OO_PS4_TOOLCHAIN"
          [ -f "$SRC" ] || { echo "$SRC not found in repo root"; ls; exit 1; }

          clang-18 --target=x86_64-pc-freebsd12-elf -fPIC -funwind-tables -c \
            $EXTRA_CFLAGS -isysroot "$TC" -isystem "$TC/include" "$SRC" -o "$NAME.o" || {
              echo "--- compile failed. Headers present:"
              ls "$TC/include/orbis" | grep -i -E "pad|userservice|appinst|videoout" || true
              exit 1
            }

          LIBS="-lc -lkernel"
          NEEDED="ScePad SceUserService SceVideoOut"
          case "$EXTRA_CFLAGS" in *ENABLE_APPINST*) NEEDED="$NEEDED SceAppInstUtil";; esac
          for l in $NEEDED; do
            if compgen -G "$TC/lib/lib$l.*" > /dev/null; then
              LIBS="$LIBS -l$l"
            else
              echo "ERROR: stub lib$l not found in $TC/lib"; ls "$TC/lib" | head -60; exit 1
            fi
          done
          # optional: lets the app hide the system splash screen
          if compgen -G "$TC/lib/libSceSystemService.*" > /dev/null; then
            LIBS="$LIBS -lSceSystemService"
          fi
          echo "Linking with: $LIBS"

          /usr/lib/llvm-18/bin/ld.lld "$NAME.o" -o "$NAME.elf" \
            -m elf_x86_64 -pie --script "$TC/link.x" --eh-frame-hdr \
            -L"$TC/lib" $LIBS "$TC/lib/crt1.o"
          "$TC/bin/linux/create-fself" -in="$NAME.elf" -out="$NAME.oelf" \
            --eboot eboot.bin --paid 0x3800000000000011
          ls -l "$NAME.elf" eboot.bin

      - name: Provide libssl1.1 for PkgTool.Core
        run: |
          set -euo pipefail
          POOL=http://archive.ubuntu.com/ubuntu/pool/main/o/openssl
          DEB=$(curl -fsSL "$POOL/" | grep -oE 'libssl1\.1_[0-9A-Za-z.+~-]+_amd64\.deb' | sort -uV | tail -n1)
          curl -fsSL -o "$RUNNER_TEMP/libssl.deb" "$POOL/$DEB"
          mkdir -p "$RUNNER_TEMP/libssl11"
          dpkg-deb -x "$RUNNER_TEMP/libssl.deb" "$RUNNER_TEMP/libssl11"
          echo "SSL11_DIR=$RUNNER_TEMP/libssl11/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Build param.sfo, GP4 and fake PKG
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SSL11_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          TC="$OO_PS4_TOOLCHAIN"
          BIN="$TC/bin/linux"
          mkdir -p pkg/sce_sys/about pkg/sce_module
          cp eboot.bin pkg/eboot.bin

          # icon: use icon0.png from the repo root if you uploaded one
          if [ -f icon0.png ]; then
            cp icon0.png pkg/sce_sys/icon0.png
          else
            python3 - <<'PY'
          import struct, zlib
          def chunk(t, d):
              c = struct.pack(">I", len(d)) + t + d
              return c + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          w = h = 512
          row = b"\x00" + bytes([32, 64, 160]) * w
          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(row * h, 9))
                 + chunk(b"IEND", b""))
          open("pkg/sce_sys/icon0.png", "wb").write(png)
          PY
          fi

          FILES="eboot.bin sce_sys/param.sfo sce_sys/icon0.png"
          for item in right.sprx:sce_sys/about libc.prx:sce_module libSceFios2.prx:sce_module; do
            n="${item%%:*}"; d="${item##*:}"
            src=$(find "$TC" -type f -name "$n" -print -quit)
            if [ -n "$src" ]; then
              cp "$src" "pkg/$d/$n"
              FILES="$FILES $d/$n"
            fi
          done

          SFO=pkg/sce_sys/param.sfo
          set_entry() { "$BIN/PkgTool.Core" sfo_setentry "$SFO" "$1" --type "$2" --maxsize "$3" --value "$4"; }
          "$BIN/PkgTool.Core" sfo_new "$SFO"
          set_entry APP_TYPE Integer 4 1
          set_entry APP_VER Utf8 8 "$VERSION"
          set_entry ATTRIBUTE Integer 4 0
          set_entry CATEGORY Utf8 4 gd
          set_entry CONTENT_ID Utf8 48 "$CONTENT_ID"
          set_entry DOWNLOAD_DATA_SIZE Integer 4 0
          set_entry SYSTEM_VER Integer 4 0
          set_entry TITLE Utf8 128 "$TITLE"
          set_entry TITLE_ID Utf8 12 "$TITLE_ID"
          set_entry VERSION Utf8 8 "$VERSION"
          [ "$(head -c4 "$SFO" | tail -c3)" = "PSF" ] || { echo "param.sfo is missing the PSF magic"; exit 1; }

          ( cd pkg && "$BIN/create-gp4" -out pkg.gp4 --content-id="$CONTENT_ID" --files "$FILES" )
          "$BIN/PkgTool.Core" pkg_build pkg/pkg.gp4 .
          mv "$CONTENT_ID.pkg" final.pkg
          ls -l final.pkg

      - name: Upload final.pkg
        uses: actions/upload-artifact@v4
        with:
          name: final-pkg
          path: final.pkg
          if-no-files-found: error

      - name: Upload debug files
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            pkg_vault.elf
            eboot.bin
            pkg/sce_sys/param.sfo
            pkg/pkg.gp4
