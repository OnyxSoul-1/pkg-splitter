<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PKG Splitter - PS4 Vault Tool</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="background-glow"></div>

<main class="container">
  <header>
    <div class="logo">📦</div>
    <h1>PKG Splitter</h1>
    <p class="sub">Cut large <code>.pkg</code> files into your custom size.<br>Download parts one by one to your USB.</p>
  </header>

  <section class="card">
    <h2>1 · Cut the Game</h2>
    
    <div class="input-group file-upload">
      <label for="split-file" class="file-label">
        <span class="file-icon">📁</span>
        <span id="file-text">Choose a .pkg file</span>
      </label>
      <input type="file" id="split-file" accept=".pkg">
    </div>

    <div class="grid-2">
      <div class="input-group">
        <label>Output Name</label>
        <input type="text" id="split-name" placeholder="GTA5" autocomplete="off">
      </div>

      <div class="input-group">
        <label>Cut Size (in GB)</label>
        <input type="number" id="split-size-custom" step="0.1" min="0.1" value="4" placeholder="e.g. 4">
      </div>
    </div>

    <button id="split-go" class="btn-primary">
      <span>Cut File Into Parts</span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>
    </button>

    <!-- Loading Bar -->
    <div id="loading" style="display: none; text-align: center; margin-bottom: 1rem; color: var(--accent); font-weight: bold;">
      ✂️ Cutting file... please wait...
    </div>

    <!-- Terminal Log -->
    <div class="terminal">
      <div class="terminal-header">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <span class="terminal-title">output.log</span>
      </div>
      <div id="split-log" class="log"></div>
    </div>
  </section>

  <!-- The Download List Area -->
  <section class="card" id="download-card" style="display: none; margin-top: 1.5rem;">
    <h2>2 · Download Parts</h2>
    <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem;">Click each part to download it to your USB.</p>
    <div id="download-list" class="download-list"></div>
  </section>

  <footer>
    <p>Use the <strong>PKG Vault</strong> app on your PS4 to join and install them.</p>
  </footer>
</main>

<script src="js/split.js"></script>
<script>
  document.getElementById('split-file').addEventListener('change', function(e) {
    const fileName = e.target.files[0] ? e.target.files[0].name : "Choose a .pkg file";
    document.getElementById('file-text').textContent = fileName;
  });
</script>
</body>
</html>
